# Cortex-M55 QEMU verification gate (mps3/corstone300/an547)
CONFIG_PEBBLE_COMPAT=y
CONFIG_PEBBLE_COMPAT_LOG_LEVEL_INF=y
CONFIG_PEBBLE_COMPAT_VERIFY_MPU=y

# Match Halo's Cortex-M55 hard-float ABI and ARMv8.1-M MPU configuration
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_ARM_MPU=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Place .pbw executable arena in upper 64 KB of Corstone-300 Cortex-M55 ITCM (0x10070000),
# above Zephyr's flash image in itcm@10000000, mirroring Halo's ITCM heap (HALO_MEM_REGION_EXTERNAL).
CONFIG_PEBBLE_COMPAT_ITCM_EXEC_ADDR=0x10070000
CONFIG_PEBBLE_COMPAT_FALLBACK_EXEC_ARENA_SIZE=65536
CONFIG_PEBBLE_COMPAT_FALLBACK_DATA_HEAP_SIZE=409600

# Stack & diagnostic configuration
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
